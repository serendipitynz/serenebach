name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # golangci-lint covers the standard set (errcheck / govet /
      # ineffassign / staticcheck / unused) plus the project linters
      # enabled in .golangci.yml — notably gocyclo at min-complexity 15
      # and gofmt (declared under `formatters:` in v2). Without this
      # step the config file would not be read and the gocyclo / gofmt
      # guards would silently no-op.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # The gocyclo cap is a design rule — complex functions get split,
      # not excused — so the one linter whose //nolint golangci-lint
      # would honour is banned outright. Without this, the cap degrades
      # into a suggestion that any PR can opt out of in one line.
      - name: ban //nolint:gocyclo
        run: |
          if git grep -nE 'nolint:.*gocyclo' -- '*.go'; then
            echo '::error::`//nolint:gocyclo` is banned. Split the function to complexity <=15 instead of suppressing.'
            exit 1
          fi

      # Admin JS is served as plain ES modules with no bundler, so nothing
      # else in the pipeline would ever parse it. biome is a standalone
      # Rust binary, which keeps this job free of Node and node_modules.
      - name: Set up biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.7

      - name: biome lint
        run: biome lint .

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
